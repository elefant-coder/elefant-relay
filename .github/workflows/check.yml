# macOS: the same gate as harness/check.sh (tests, two apps pairing, real-mouse click checks) on every push.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: app deps, and fetch the Electron binary now (two apps downloading it at once on first launch hung the run)
        run: cd app && npm ci && npx electron --version
      - name: harness/check.sh (a fake claude on PATH — the runner has no AI app, and the app won't start without one)
        run: |
          export PATH="$PWD/app/test/fake:$PATH" FAKE_LOG="$RUNNER_TEMP/fake-claude.jsonl"
          harness/check.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-mac
          path: |
            harness/out/*/summary.md
            harness/out/*/*.log
            harness/out/*/clicks/checks.jsonl
            harness/out/*/clicks/app.out
            harness/out/*/clicks/driver.log
            harness/out/*/allow/checks.jsonl
            harness/out/*/allow/app.out
            harness/out/*/pair/*.png
            harness/out/*/pair/*.out
